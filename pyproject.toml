[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfr"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ollama", "pydantic", "PyYAML", "tqdm", "numpy", "pandas", "matplotlib", "jsonschema",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "tomli; python_version < '3.11'"]
viz = ["pybullet>=3.2.6", "imageio>=2.34", "imageio-ffmpeg>=0.5", "pillow>=10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
